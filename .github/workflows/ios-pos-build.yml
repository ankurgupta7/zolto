name: iOS POS Build & Test

# The native iOS POS app (GwinnPOS) lives in ios/GwinnPOS/ — migrated
# from the ankurgupta7/kalakosh-pos-ios repo. Like android-build.yml, this
# only runs when the app (or this pipeline) actually changed, so web-only
# commits don't burn macOS runner minutes.

on:
  # PRs stay path-filtered so web-only PRs don't burn macOS runner minutes.
  pull_request:
    branches: ["main"]
    paths:
      - "ios/GwinnPOS/**"
      - ".github/workflows/ios-pos-build.yml"
      - ".github/actions/ios-setup/**"
  # Pushes to main are deliberately NOT path-filtered — merchants download this
  # build from the rolling release, so every merge has to republish or "latest
  # main build" stops being true. This does cost macOS minutes on every merge;
  # that is the price of the download link never being stale.
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Simulator build — runs on every trigger (PRs, pushes, manual).
  # Produces GwinnPOS-simulator.zip for Appetize browser preview.
  # POS_API_KEY is injected from GitHub repo secrets so no clipboard
  # paste is needed inside Appetize.
  # ────────────────────────────────────────────────────────────────────────────
  build-simulator:
    name: Build (Simulator + Appetize zip)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: iOS Build Setup
        uses: ./.github/actions/ios-setup

      - name: Run TWINT contract tests
        working-directory: ios/GwinnPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild test \
            -project GwinnPOS.xcodeproj \
            -scheme GwinnPOS \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing GwinnPOSTests/TwintModelsTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        working-directory: ios/GwinnPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild test \
            -project GwinnPOS.xcodeproj \
            -scheme GwinnPOS \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Build for simulator
        working-directory: ios/GwinnPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild build \
            -project GwinnPOS.xcodeproj \
            -scheme GwinnPOS \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Stage simulator app for Appetize upload
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "GwinnPOS.app" \
            -path "*/Debug-iphonesimulator/*" | head -1)
          echo "Found app: $APP"
          mkdir -p "$RUNNER_TEMP/Appetize"
          cp -r "$APP" "$RUNNER_TEMP/Appetize/"

      - name: Upload simulator zip
        uses: actions/upload-artifact@v4
        with:
          name: GwinnPOS-simulator
          path: ${{ runner.temp }}/Appetize/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Unsigned IPA — only on main branch pushes (not on PRs).
  # AltServer re-signs with your free Apple ID before sideloading.
  # Skipping on PRs saves ~10-12 min of macOS runner time per PR update.
  # ────────────────────────────────────────────────────────────────────────────
  build-unsigned-ipa:
    name: Build Unsigned IPA (Sideload)
    runs-on: macos-15
    # No IPA — and so no rolling-release publish — from a tree whose tests
    # did not pass. build-simulator is the job that compiles and tests.
    needs: build-simulator
    # Only produce the device IPA when merging to main or running manually.
    # PRs only need the simulator build for validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: iOS Build Setup
        uses: ./.github/actions/ios-setup

      - name: Archive (unsigned)
        working-directory: ios/GwinnPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild archive \
            -project GwinnPOS.xcodeproj \
            -scheme GwinnPOS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/GwinnPOS.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Package as IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/GwinnPOS.xcarchive/Products/Applications" \
            -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "GwinnPOS-unsigned.ipa" Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GwinnPOS-unsigned
          path: ${{ runner.temp }}/GwinnPOS-unsigned.ipa
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Publish the IPA to the rolling `pos-latest` release, giving every
  # tenant's admin a stable, auth-free download URL.
  #
  # This IPA is UNSIGNED, so it is not tap-to-install: the merchant re-signs it
  # with AltServer/Sideloadly from a computer first. The admin UI says so
  # plainly (client/src/components/admin/PosAppCard.tsx) rather than implying an
  # App Store install. Making this tap-installable needs an Apple Developer
  # Program account and App Store Connect secrets so the build can go to
  # TestFlight — a separate step, not wired here.
  #
  # Runs on ubuntu, not macos: it only moves an artifact around.
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish IPA to rolling release
    needs: build-unsigned-ipa
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: GwinnPOS-unsigned
          path: ipa

      - name: Stage asset + build metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ipa/GwinnPOS-unsigned.ipa dist/GwinnPOS-latest-unsigned.ipa
          cat > dist/ios-build.json <<JSON
          {
            "platform": "ios",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "signed": false
          }
          JSON
          cat dist/ios-build.json

      - name: Publish to rolling release
        uses: ./.github/actions/pos-release-upload
        with:
          files: dist/GwinnPOS-latest-unsigned.ipa dist/ios-build.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: POS backend smoke test — deliberately NOT upstream of the IPA.
  # It reports on the live server rather than on the code, so a rotated key or
  # a deployment blip cannot stop a release build that is otherwise sound.
  # Runs on ubuntu: it is one curl, and macOS minutes cost roughly ten times
  # as much.
  # ────────────────────────────────────────────────────────────────────────────
  pos-health:
    name: Verify POS server health
    runs-on: ubuntu-latest
    steps:
      # Smoke-test the live POS backend with the platform's own POS test key.
      # The key is REQUIRED and this check never skips: the superadmin mints
      # it in the operator console (Platform → POS test key, backed by the
      # ordinary "platform-tests" tenant) and stores it as the POS_API_KEY
      # secret. It is a normal per-tenant key with no special rules, so this
      # exercises the same auth path a merchant's register does.
      # POS_API_BASE_URL overrides the host for a staging or self-hosted run.
      - name: Verify POS server health
        env:
          POS_API_BASE_URL: ${{ secrets.POS_API_BASE_URL }}
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          POS_API_BASE_URL="${POS_API_BASE_URL:-https://gwinn.ch}"
          if [ -z "${POS_API_KEY}" ]; then
            echo "::error::POS_API_KEY secret is not set. Mint the platform POS test key (operator console → Platform → POS test key) and store it as the POS_API_KEY secret."
            exit 1
          fi
          echo "Checking POS health at ${POS_API_BASE_URL}/api/pos/health ..."
          status=$(curl -sS -o /tmp/pos-health.out -w "%{http_code}" \
            -H "x-pos-key: ${POS_API_KEY}" "${POS_API_BASE_URL}/api/pos/health" || echo "000")
          echo "HTTP ${status}"; cat /tmp/pos-health.out 2>/dev/null || true; echo
          if [ "$status" = "200" ]; then
            echo "POS server healthy."
          elif [ "$status" = "401" ]; then
            echo "::error::POS server at ${POS_API_BASE_URL} rejected POS_API_KEY. Rotate the platform POS test key (operator console → Platform → POS test key) and update the secret."
            exit 1
          else
            echo "POS health check failed with status ${status}"
            exit 1
          fi
