name: iOS POS Build & Test

# The native iOS POS app (ZoltoPOS) lives in ios/ZoltoPOS/ — migrated
# from the ankurgupta7/kalakosh-pos-ios repo. Like android-build.yml, this
# only runs when the app (or this pipeline) actually changed, so web-only
# commits don't burn macOS runner minutes.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "ios/ZoltoPOS/**"
      - ".github/workflows/ios-pos-build.yml"
      - ".github/actions/ios-setup/**"
  push:
    branches: ["main"]
    paths:
      - "ios/ZoltoPOS/**"
      - ".github/workflows/ios-pos-build.yml"
      - ".github/actions/ios-setup/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Simulator build — runs on every trigger (PRs, pushes, manual).
  # Produces ZoltoPOS-simulator.zip for Appetize browser preview.
  # POS_API_KEY is injected from GitHub repo secrets so no clipboard
  # paste is needed inside Appetize.
  # ────────────────────────────────────────────────────────────────────────────
  build-simulator:
    name: Build (Simulator + Appetize zip)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: iOS Build Setup
        uses: ./.github/actions/ios-setup

      - name: Run TWINT contract tests
        working-directory: ios/ZoltoPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild test \
            -project ZoltoPOS.xcodeproj \
            -scheme ZoltoPOS \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing ZoltoPOSTests/TwintModelsTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        working-directory: ios/ZoltoPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild test \
            -project ZoltoPOS.xcodeproj \
            -scheme ZoltoPOS \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Build for simulator
        working-directory: ios/ZoltoPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild build \
            -project ZoltoPOS.xcodeproj \
            -scheme ZoltoPOS \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      # Smoke-test the live POS backend with the platform's own POS test key.
      # The key is REQUIRED and this check never skips: the superadmin mints
      # it in the operator console (Platform → POS test key, backed by the
      # ordinary "platform-tests" tenant) and stores it as the POS_API_KEY
      # secret. It is a normal per-tenant key with no special rules, so this
      # exercises the same auth path a merchant's register does.
      # POS_API_BASE_URL overrides the host for a staging or self-hosted run.
      - name: Verify POS server health
        env:
          POS_API_BASE_URL: ${{ secrets.POS_API_BASE_URL }}
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          POS_API_BASE_URL="${POS_API_BASE_URL:-https://zolto.ch}"
          if [ -z "${POS_API_KEY}" ]; then
            echo "::error::POS_API_KEY secret is not set. Mint the platform POS test key (operator console → Platform → POS test key) and store it as the POS_API_KEY secret."
            exit 1
          fi
          echo "Checking POS health at ${POS_API_BASE_URL}/api/pos/health ..."
          status=$(curl -sS -o /tmp/pos-health.out -w "%{http_code}" \
            -H "x-pos-key: ${POS_API_KEY}" "${POS_API_BASE_URL}/api/pos/health" || echo "000")
          echo "HTTP ${status}"; cat /tmp/pos-health.out 2>/dev/null || true; echo
          if [ "$status" = "200" ]; then
            echo "POS server healthy."
          elif [ "$status" = "401" ]; then
            echo "::error::POS server at ${POS_API_BASE_URL} rejected POS_API_KEY. Rotate the platform POS test key (operator console → Platform → POS test key) and update the secret."
            exit 1
          else
            echo "POS health check failed with status ${status}"
            exit 1
          fi

      - name: Stage simulator app for Appetize upload
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "ZoltoPOS.app" \
            -path "*/Debug-iphonesimulator/*" | head -1)
          echo "Found app: $APP"
          mkdir -p "$RUNNER_TEMP/Appetize"
          cp -r "$APP" "$RUNNER_TEMP/Appetize/"

      - name: Upload simulator zip
        uses: actions/upload-artifact@v4
        with:
          name: ZoltoPOS-simulator
          path: ${{ runner.temp }}/Appetize/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Unsigned IPA — only on main branch pushes (not on PRs).
  # AltServer re-signs with your free Apple ID before sideloading.
  # Skipping on PRs saves ~10-12 min of macOS runner time per PR update.
  # ────────────────────────────────────────────────────────────────────────────
  build-unsigned-ipa:
    name: Build Unsigned IPA (Sideload)
    runs-on: macos-15
    # Only produce the device IPA when merging to main or running manually.
    # PRs only need the simulator build for validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: iOS Build Setup
        uses: ./.github/actions/ios-setup

      - name: Archive (unsigned)
        working-directory: ios/ZoltoPOS
        env:
          POS_API_KEY: ${{ secrets.POS_API_KEY }}
        run: |
          xcodebuild archive \
            -project ZoltoPOS.xcodeproj \
            -scheme ZoltoPOS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ZoltoPOS.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            POS_API_KEY="$POS_API_KEY" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Package as IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/ZoltoPOS.xcarchive/Products/Applications" \
            -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "ZoltoPOS-unsigned.ipa" Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZoltoPOS-unsigned
          path: ${{ runner.temp }}/ZoltoPOS-unsigned.ipa
          retention-days: 14
