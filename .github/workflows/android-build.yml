name: Android Build & Test

# The POS app lives in android/ and is multi-tenant: registers are bound to
# their store at runtime (SetupActivity → PosConfig), so there are no baked-in
# server URLs or POS keys and no secrets.xml step. Unit tests + a debug APK
# build guard every change under android/.

on:
  pull_request:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ⚠ KNOWN FAILURE: this step currently fails wrapper validation.
      # android/gradle/wrapper/gradle-wrapper.jar is a Gradle **4.4.1** jar
      # (see build-receipt.properties inside it) while gradle-wrapper.properties
      # asks for **8.9**, so its SHA-256 is not in the known-good list:
      #   b5173cbc1029dbe2212de0ff1c6331940f1c841bb26a0685b7189615802bf365
      # It bootstraps fine at runtime (it downloads and delegates to 8.9), which
      # is why nobody noticed — but the mismatch is exactly the supply-chain
      # smell wrapper validation exists to catch.
      #
      # FIX (needs a machine with unrestricted network): regenerate it with
      #   cd android && gradle wrapper --gradle-version 8.9
      # or copy the jar from a checksum-verified gradle-8.9-bin.zip, then commit.
      # Do NOT set `validate-wrappers: false` — that silences the guard instead
      # of fixing the jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Wire-format contract tests first: they guard the app and
      # server/pos.ts drifting apart (TWINT, payment-intent, Terminal
      # provisioning models).
      - name: Run API contract tests
        run: ./gradlew :app:testDebugUnitTest --tests '*Twint*' --tests '*StripeModels*' --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZoltoPOS-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
