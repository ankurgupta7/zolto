<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gwinn POS — payment</title>
<style>
  :root{
    --oyster:#F7F3EE; --dark:#2D2620; --near-black:#1C1714; --dark-mid:#3A3028;
    --gold:#B8963E; --gold-light:#D4B060; --ivory:#EDE7DF;
    --muted:#7A6D65; --border:#DDD4C9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden}
  body{
    background:var(--oyster);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--near-black);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:lining-nums tabular-nums}

  .status{
    background:var(--dark);color:#fff;height:28px;flex:0 0 28px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:12px;font-weight:600;letter-spacing:.02em;
  }
  .status .right{display:flex;gap:5px;align-items:center;opacity:.9}

  .toolbar{
    background:var(--dark);flex:0 0 52px;
    display:flex;align-items:center;gap:12px;padding:0 14px;
  }
  .toolbar .back{color:#fff;font-size:21px;line-height:1;opacity:.85}
  .toolbar .name{color:#fff;font-size:15px;font-weight:600}

  /* ---- the line item ---- */
  .items{padding:18px 14px 0}
  .item{
    background:#fff;border:1px solid var(--border);border-radius:4px;
    display:flex;align-items:center;gap:12px;padding:10px;
  }
  .item img{width:62px;height:62px;object-fit:cover;border-radius:3px;flex:0 0 62px}
  .item .t{flex:1}
  .item .n{font-size:14px;font-weight:700;letter-spacing:.01em}
  .item .q{font-size:12px;color:var(--muted);margin-top:3px}
  .item .p{font-size:14.5px;font-weight:700}

  /* ---- total ---- */
  .total{
    margin:16px 14px 0;background:var(--dark);border-radius:4px;
    padding:18px 18px 20px;color:#fff;
  }
  .total .l{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold-light);font-weight:600;
  }
  .total .v{font-size:38px;font-weight:300;letter-spacing:-.01em;margin-top:5px}

  /* ---- payment method row — the point of the whole video ---- */
  .payl{
    margin:26px 14px 0;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);font-weight:600;
  }
  .pays{margin:11px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pay{
    background:#fff;border:1px solid var(--border);border-radius:4px;
    height:96px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:9px;
  }
  .pay .g{height:26px;display:flex;align-items:center}
  .pay .lab{font-size:13px;font-weight:700;letter-spacing:.05em}
  .pay.on{background:var(--gold);border-color:var(--gold)}

  .foot{flex:1;display:flex;align-items:flex-end;padding:0 14px 18px}
  .cancel{
    width:100%;text-align:center;color:var(--muted);font-size:13px;
    letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  }
</style>
</head>
<body>

  <div class="status">
    <span class="num">18:42</span>
    <span class="right"><span class="num">5G</span> ▮▮▮ <span class="num">87%</span></span>
  </div>

  <div class="toolbar">
    <span class="back">‹</span>
    <span class="name">Verkauf prüfen</span>
  </div>

  <div class="items">
    <div class="item">
      <img src="../../assets/necklaces/necklace-pearl-bib-collar-with-tag.jpg" alt="">
      <div class="t">
        <div class="n">Perlenkragen</div>
        <div class="q num">1 × CHF 340</div>
      </div>
      <div class="p num">CHF 340</div>
    </div>
    <div class="item">
      <img src="../../assets/bracelets-and-mixed/flatlay-silver-bangle-and-pearl-hoop-earrings.jpg" alt="">
      <div class="t">
        <div class="n">Silberreif</div>
        <div class="q num">1 × CHF 120</div>
      </div>
      <div class="p num">CHF 120</div>
    </div>
  </div>

  <div class="total">
    <div class="l">Total</div>
    <div class="v num">CHF 460.00</div>
  </div>

  <div class="payl">Zahlungsart</div>
  <div class="pays">
    <div class="pay on">
      <div class="g">
        <!-- Neutral stand-in only. TWINT's actual mark is a trademark and is NOT
             reproduced here — swap in the licensed asset before publishing. -->
        <svg width="38" height="24" viewBox="0 0 38 24" fill="none" stroke="#1C1714" stroke-width="1.9" aria-hidden="true">
          <circle cx="13" cy="12" r="9"/><circle cx="25" cy="12" r="9"/>
        </svg>
      </div>
      <div class="lab">TWINT</div>
    </div>
    <div class="pay">
      <div class="g">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#1C1714" stroke-width="1.8">
          <rect x="1" y="2" width="28" height="18" rx="3"/><path d="M1 8h28"/>
        </svg>
      </div>
      <div class="lab">Karte</div>
    </div>
    <div class="pay">
      <div class="g">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#1C1714" stroke-width="1.8">
          <rect x="1" y="4" width="28" height="15" rx="2.5"/><circle cx="15" cy="11.5" r="4"/>
        </svg>
      </div>
      <div class="lab">Bar</div>
    </div>
    <div class="pay">
      <div class="g">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#1C1714">
          <rect x="1" y="1" width="8" height="8" rx="1.5"/><rect x="15" y="1" width="8" height="8" rx="1.5"/>
          <rect x="1" y="15" width="8" height="8" rx="1.5"/>
          <rect x="15" y="15" width="3.4" height="3.4"/><rect x="19.6" y="19.6" width="3.4" height="3.4"/>
        </svg>
      </div>
      <div class="lab">TWINT QR</div>
    </div>
  </div>

  <div class="foot"><div class="cancel">Abbrechen</div></div>

</body>
</html>
