# ─────────────────────────────────────────────────────────────────────────────
# Zolto (zolto.ch) — Self-Hosted Docker Compose
#
# Services:
#   app   — Node.js application (Express + tRPC + React frontend)
#   db    — MySQL 8 database
#   caddy — Reverse proxy with automatic HTTPS (standalone profile only)
#
# This stack is designed to run on the SAME server as Kalakosh-ch, fully
# independently: its own containers, its own MySQL volume, its own bridge
# network — no shared state with the Kalakosh-ch stack.
#
# Two serving modes:
#   1. SHARED (default, recommended): the Kalakosh-ch stack's Caddy owns host
#      ports 80/443 and reverse-proxies zolto.ch to this app over the shared
#      "kalakosh-shared" Docker network (this stack publishes NO host ports).
#      In the Kalakosh-ch Caddyfile, point zolto.ch at `zolto-app:3000`:
#          zolto.ch { reverse_proxy zolto-app:3000 }
#          www.zolto.ch { redir https://zolto.ch{uri} permanent }
#      Then just:  docker compose up -d
#
#   2. STANDALONE: this stack's own bundled Caddy serves zolto.ch itself.
#      Only usable if nothing else owns 80/443 on the host — so NOT alongside
#      Kalakosh-ch unless you remap ports. Enable with:
#          docker compose --profile standalone up -d
#
# Usage:
#   1. Copy .env.example to .env and fill in all values
#   2. docker network create kalakosh-shared   # once, if not already created
#   3. docker compose up -d
#
# NOTE: only PLATFORM credentials appear below. Tenant credentials (POS keys,
# tenants' Stripe accounts, per-tenant Discord channels) live in the database
# — see the "GOLDEN RULE" header in .env.example.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Application ───────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      # Database
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}

      # Auth (Google OAuth)
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # Tenant secrets vault (master encryption key — server/tenantSecrets.ts)
      TENANT_SECRETS_KEY: ${TENANT_SECRETS_KEY}

      # Discord bot (single platform bot; per-tenant channel/user IDs live in
      # tenant_settings, not here)
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      DISCORD_OWNER_USER_ID: ${DISCORD_OWNER_USER_ID}

      # LLM — OpenAI-compatible (OpenAI / Groq / Ollama)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

      # S3-compatible storage (AWS S3 / Cloudflare R2 / Backblaze B2)
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}

      # Stripe payments (PLATFORM account: billing + Connect platform)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      # POS Terminal webhook (POS API keys are per-tenant, hashed in the DB —
      # there is deliberately no POS_API_KEY env var)
      STRIPE_POS_WEBHOOK_SECRET: ${STRIPE_POS_WEBHOOK_SECRET}

    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      # Joined to the shared proxy network so the Kalakosh-ch stack's Caddy can
      # reach this app directly and serve it at zolto.ch. The alias is the
      # hostname the Kalakosh-ch Caddyfile reverse-proxies to.
      shared:
        aliases:
          - zolto-app

  # ── MySQL Database ───────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Caddy (reverse proxy + automatic HTTPS) ──────────────────────────────────────────
  #
  # This bundled Caddy is only needed to run Zolto STANDALONE (its own Caddy
  # serving zolto.ch). When running alongside the Kalakosh-ch stack — the
  # intended setup — leave it off: the Kalakosh-ch Caddy already owns ports
  # 80/443 and serves zolto.ch for this app over the shared network, so a
  # second Caddy here would just compete for the host ports. It therefore
  # lives behind the "standalone" profile and does NOT start with a plain
  # `docker compose up`.
  #
  #   Alongside Kalakosh (default):  docker compose up -d
  #   Standalone (own Caddy):        docker compose --profile standalone up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - standalone
    # Host ports are overridable. Defaults deliberately differ from 80/443 so
    # the standalone profile can also run on a host where something else owns
    # the standard ports (e.g. while migrating DNS over to zolto.ch).
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # Caddyfile reads this to pick which domain(s) to serve — see Caddyfile.
      # Defaults to zolto.ch; set ":80" for plain-HTTP testing by IP before
      # DNS is pointed at the server.
      SITE_DOMAIN: ${SITE_DOMAIN:-zolto.ch}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  # Shared, cross-stack network that lets the Kalakosh-ch Caddy reach this
  # app and serve it at zolto.ch. Declared external so both stacks attach to
  # the SAME Docker network regardless of start order. Create it once with:
  #   docker network create kalakosh-shared
  shared:
    external: true
    name: kalakosh-shared
