# ─────────────────────────────────────────────────────────────────────────────
# Kalakosh Zurich — Self-Hosted Docker Compose
#
# Services:
#   app   — Node.js application (Express + tRPC + React frontend)
#   db    — MySQL 8 database
#   caddy — Reverse proxy with automatic HTTPS (Let's Encrypt)
#
# Usage:
#   1. Copy .env.example to .env and fill in all values
#   2. docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application ───────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      # Database
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}

      # Auth (Google OAuth)
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # Discord bot
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      DISCORD_OWNER_USER_ID: ${DISCORD_OWNER_USER_ID}

      # LLM — OpenAI-compatible (OpenAI / Groq / Ollama)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

      # S3-compatible storage (AWS S3 / Cloudflare R2 / Backblaze B2)
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}

      # Stripe payments (online checkout + POS terminal)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      # POS Terminal (iOS market-stall app)
      POS_API_KEY: ${POS_API_KEY}
      STRIPE_POS_WEBHOOK_SECRET: ${STRIPE_POS_WEBHOOK_SECRET}

    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ── MySQL Database ───────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Caddy (reverse proxy + automatic HTTPS) ──────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Host ports are overridable so this stack can run alongside another
    # instance (e.g. Kalakosh-ch) on the same server without a port clash.
    # Defaults deliberately differ from the standard 80/443.
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # Caddyfile reads this to pick which domain(s) to serve — see Caddyfile.
      SITE_DOMAIN: ${SITE_DOMAIN:-zolto.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
