# ─────────────────────────────────────────────────────────────────────────────
# Kalakosh Zurich — Self-Hosted Docker Compose
#
# Services:
#   app   — Node.js application (Express + tRPC + React frontend)
#   db    — MySQL 8 database
#   caddy — Reverse proxy with automatic HTTPS (Let's Encrypt)
#
# Usage:
#   1. Copy .env.example to .env and fill in all values
#   2. docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Application ───────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      # Database
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}

      # Auth (Google OAuth)
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # Discord bot
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      DISCORD_OWNER_USER_ID: ${DISCORD_OWNER_USER_ID}

      # LLM — OpenAI-compatible (OpenAI / Groq / Ollama)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

      # S3-compatible storage (AWS S3 / Cloudflare R2 / Backblaze B2)
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}

      # Stripe payments (online checkout + POS terminal)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      # POS Terminal (iOS market-stall app)
      POS_API_KEY: ${POS_API_KEY}
      STRIPE_POS_WEBHOOK_SECRET: ${STRIPE_POS_WEBHOOK_SECRET}

    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      # Joined to the shared proxy network so the Kalakosh-ch stack's Caddy can
      # reach this app directly and serve it at zolto.kalakosh.ch. The alias is
      # the hostname the Kalakosh Caddyfile reverse-proxies to.
      shared:
        aliases:
          - zolto-app

  # ── MySQL Database ───────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Caddy (reverse proxy + automatic HTTPS) ──────────────────────────────────────────
  #
  # This bundled Caddy is only needed to run Zolto STANDALONE (on its own
  # domain/IP). When running alongside the Kalakosh-ch stack — the intended
  # setup — leave it off: the Kalakosh Caddy already owns ports 80/443 and
  # serves this app at zolto.kalakosh.ch, so a second Caddy here would just
  # compete for the host ports. It therefore lives behind the "standalone"
  # profile and does NOT start with a plain `docker compose up`.
  #
  #   Alongside Kalakosh (default):  docker compose up -d
  #   Standalone (own Caddy):        docker compose --profile standalone up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - standalone
    # Host ports are overridable so this stack can also run alongside another
    # instance on its own ports if you prefer that over the subdomain setup.
    # Defaults deliberately differ from the standard 80/443.
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # Caddyfile reads this to pick which domain(s) to serve — see Caddyfile.
      # Defaults to ":80" (plain HTTP, no domain needed) for testing by IP;
      # set to a real domain in .env once you're ready for HTTPS.
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  # Shared, cross-stack network that lets the Kalakosh-ch Caddy reach this
  # app and serve it at zolto.kalakosh.ch. Declared external so both stacks
  # attach to the SAME Docker network regardless of start order. Create it
  # once with:  docker network create kalakosh-shared
  shared:
    external: true
    name: kalakosh-shared
