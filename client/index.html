<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Primary Meta Tags. These are neutral platform defaults; storefront and
         product pages override title/description/OG per tenant at runtime. -->
    <title>Gwinn</title>
    <meta
      name="description"
      content="Gwinn gives makers and artisans a point-of-sale and an online store that share one inventory."
    />
    <meta name="author" content="Gwinn" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicons (Gwinn brush-G mark). Storefronts override these per tenant
         via server-side head injection (see server/storefrontHead.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gwinn" />
    <meta
      property="og:description"
      content="Sell online and in person, without managing technology."
    />
    <meta property="og:site_name" content="Gwinn" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Gwinn" />
    <meta
      property="twitter:description"
      content="Sell online and in person, without managing technology."
    />

    <!-- Brand webfonts, served first-party so no visitor IP ever reaches
         Google's font CDN. Regenerate with tools/fonts/vendor-fonts.sh. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The Umami page-view tag is injected per request by server/analytics.ts,
         not baked in here. This shell is shared by the marketing site and every
         tenant storefront, so a build-time constant could only ever produce one
         bucket — and an unconfigured install would still ship a dead tag, which
         is exactly what used to happen. -->
  </body>
</html>
