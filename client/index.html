<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Primary Meta Tags. These are neutral platform defaults; storefront and
         product pages override title/description/OG per tenant at runtime. -->
    <title>Zolto</title>
    <meta
      name="description"
      content="Zolto gives makers and artisans a point-of-sale and an online store that share one inventory."
    />
    <meta name="author" content="Zolto" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicons (Zolto brush-Z mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zolto" />
    <meta
      property="og:description"
      content="Sell online and in person, without managing technology."
    />
    <meta property="og:site_name" content="Zolto" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Zolto" />
    <meta
      property="twitter:description"
      content="Sell online and in person, without managing technology."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script async defer src="//www.instagram.com/embed.js"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
