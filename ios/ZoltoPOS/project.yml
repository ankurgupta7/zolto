name: ZoltoPOS
options:
  bundleIdPrefix: ch.kalakosh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

packages:
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios
    from: "4.0.0"

targets:
  ZoltoPOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZoltoPOS
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kalakosh.pos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE_SPECIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Overridden at build time by Codemagic (App settings → Environment variables → POS_API_KEY).
        # Never put the real value here.
        POS_BASE_URL: "https://kalakosh.ch"
        POS_API_KEY: ""
    dependencies:
      - package: StripeTerminal
    entitlements:
      path: ZoltoPOS/ZoltoPOS.entitlements
    info:
      path: ZoltoPOS/Info.plist
      properties:
        CFBundleDisplayName: Zolto POS
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Bluetooth is required to connect to Stripe Terminal card readers."
        NSLocationWhenInUseUsageDescription: "Location is required for Stripe Terminal payment processing compliance."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Location is required for Stripe Terminal payment processing compliance."
        NFCReaderUsageDescription: "NFC is required for Tap to Pay on iPhone."
        NSCameraUsageDescription: "Camera access is not used by this app."
        UIRequiredDeviceCapabilities:
          - armv7
        POS_BASE_URL: "$(POS_BASE_URL)"
        POS_API_KEY: "$(POS_API_KEY)"
    scheme:
      # Wire unit tests into the app scheme so `xcodebuild test -scheme
      # ZoltoPOS` runs them. The plain `build` action is unaffected — the
      # test target is not a dependency of the app.
      testTargets:
        - ZoltoPOSTests

  ZoltoPOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZoltoPOSTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: ZoltoPOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.kalakosh.pos.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
