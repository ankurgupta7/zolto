# CircleCI for zolto-pos-android
# Automatically triggers on all branches (including Pull Requests).
#
# Secrets are read from CircleCI Project Environment Variables, which must be
# set at: Project Settings → Environment Variables in the CircleCI dashboard.
# Use the same names as the GitHub Actions secrets so both pipelines are
# configured identically:
#   POS_API_BASE_URL → pos_api_base_url  (default: https://zolto.ch)
#   POS_API_KEY      → pos_api_key
#
# Stripe keys are NOT needed at build time:
# - The Terminal SDK authenticates via connection tokens fetched from the
#   backend at runtime (POST /api/pos/connection-token).
# - The location ID is fetched from GET /api/pos/config at runtime.
#   stripe_location_id is kept as an optional local-development override
#   (PaymentActivity.kt references R.string.stripe_location_id), so it is
#   generated with a placeholder default and does NOT need a CI secret.
version: 2.1

jobs:
  build-android:
    docker:
      - image: cimg/android:2026.07.1
    resource_class: large

    steps:
      - checkout

      - run:
          name: Make gradlew executable
          command: chmod +x gradlew

      - run:
          name: Generate secrets.xml from CircleCI environment variables
          command: |
            # XML-escape a string (handles &, <, >, ", ')
            escape_xml() {
              local s="$1"
              s="${s//&/&amp;}"
              s="${s//</&lt;}"
              s="${s//>/&gt;}"
              s="${s//\"/&quot;}"
              s="${s//\'/&apos;}"
              printf '%s' "$s"
            }

            # Fall back to the same placeholder defaults as the GitHub Actions
            # workflow so the build stays green even when a variable is unset.
            POS_API_BASE_URL="${POS_API_BASE_URL:-https://zolto.ch}"
            POS_API_KEY="${POS_API_KEY:-your-32-char-secret-here}"
            STRIPE_LOCATION_ID="${STRIPE_LOCATION_ID:-tml_...}"

            mkdir -p app/src/main/res/values
            out="app/src/main/res/values/secrets.xml"
            {
              echo '<?xml version="1.0" encoding="utf-8"?>'
              echo '<resources>'
              echo "    <string name=\"pos_api_base_url\" translatable=\"false\">$(escape_xml "$POS_API_BASE_URL")</string>"
              echo "    <string name=\"pos_api_key\" translatable=\"false\">$(escape_xml "$POS_API_KEY")</string>"
              echo "    <!-- stripe_publishable_key intentionally omitted: the Terminal SDK authenticates via backend connection tokens at runtime -->"
              echo "    <string name=\"stripe_location_id\" translatable=\"false\">$(escape_xml "$STRIPE_LOCATION_ID")</string>"
              echo '</resources>'
            } > "$out"
            echo "Wrote $out"

      - run:
          name: Download Dependencies
          command: ./gradlew androidDependencies

      # TWINT is exercised twice deliberately:
      # 1. A focused TWINT contract-test step gives immediate, visible feedback
      #    that the TWINT wire format still matches Zolto-ch/server/pos.ts.
      # 2. The full test suite still covers everything else.
      - run:
          name: Run TWINT contract tests
          command: ./gradlew :app:testDebugUnitTest --tests '*Twint*' --stacktrace

      - run:
          name: Run unit tests
          command: ./gradlew test --stacktrace

      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug --stacktrace

      # Smoke-test the live POS backend: the endpoint requires a valid
      # POS_API_KEY and returns 200 only when Stripe secrets are configured.
      # This catches deployments where the app builds but cannot actually
      # create payments because the server is missing secrets.
      - run:
          name: Verify POS server health
          command: |
            POS_API_BASE_URL="${POS_API_BASE_URL:-https://zolto.ch}"
            echo "Checking POS health at ${POS_API_BASE_URL}/api/pos/health ..."
            curl -fsS -H "x-pos-key: ${POS_API_KEY}" "${POS_API_BASE_URL}/api/pos/health"

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apks

      - store_test_results:
          path: app/build/test-results

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-android:
          filters:
            branches:
              only: /.*/
            tags:
              only: /.*/
