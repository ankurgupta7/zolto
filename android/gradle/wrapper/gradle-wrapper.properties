# The Gradle version this project builds against. Kept as the single source of
# truth even though no wrapper jar sits beside it: CI provisions this exact
# version through gradle/actions/setup-gradle, and `gradle wrapper` reads the
# version from here if anyone wants to restore a real wrapper — see
# android/README.md.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
